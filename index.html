    <!-- Safe JSON.stringify wrapper to prevent third-party scripts (e.g. UTMIFY/Pixels) from crashing on circular structures or cross-origin security blocks -->
    <script>
      (function() {
        var originalStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          try {
            return originalStringify(value, replacer, space);
          } catch (err) {
            try {
              var seen = new WeakSet();
              return originalStringify(value, function(key, val) {
                try {
                  if (typeof val === "object" && val !== null) {
                    // Detect Window or cross-origin objects safely
                    try {
                      if (val === window || val.self === val || val.window === val) {
                        return "[Window]";
                      }
                    } catch (e) {
                      return "[CrossOriginWindow]";
                    }

                    if (seen.has(val)) {
                      return "[Circular]";
                    }
                    seen.add(val);
                  }
                  if (replacer) {
                    return replacer(key, val);
                  }
                  return val;
                } catch (propertyError) {
                  return "[UnserializableProperty]";
                }
              }, space);
            } catch (fallbackError) {
              return '{"error":"Unserializable object structure"}';
            }
          }
        };
      })();
    </script>
